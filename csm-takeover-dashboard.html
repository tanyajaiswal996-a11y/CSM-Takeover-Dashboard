<title>CSM Takeover Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (nav + role) | work area with case list or case file; collapses to a top bar on phones */
:root{
  --bg:#F3F5F3; --surface:#FFFFFF; --sunk:#EAEEEB; --ink:#16201C; --muted:#5C6964; --line:#D9DFDB;
  --accent:#1E5B4A; --accent-ink:#FFFFFF; --accent-soft:#E1EDE8;
  --ok:#2C7A4B; --ok-soft:#E2F1E7; --warn:#A86A12; --warn-soft:#FBF0DC; --crit:#B3372B; --crit-soft:#FBE6E3; --info:#2D5B99; --info-soft:#E3ECF8;
  --f-body:"Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#161C19; --sunk:#1C2420; --ink:#E4EBE7; --muted:#93A29B; --line:#29332E;
  --accent:#6DC2A5; --accent-ink:#0F1412; --accent-soft:#1B2E27;
  --ok:#5DBE89; --ok-soft:#18291F; --warn:#E3A94B; --warn-soft:#2E2414; --crit:#EE7B6D; --crit-soft:#331B18; --info:#86ADE8; --info-soft:#18233A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#161C19; --sunk:#1C2420; --ink:#E4EBE7; --muted:#93A29B; --line:#29332E;
  --accent:#6DC2A5; --accent-ink:#0F1412; --accent-soft:#1B2E27;
  --ok:#5DBE89; --ok-soft:#18291F; --warn:#E3A94B; --warn-soft:#2E2414; --crit:#EE7B6D; --crit-soft:#331B18; --info:#86ADE8; --info-soft:#18233A;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
h1{font-size:22px;letter-spacing:-.01em}
h2{font-size:16px}
h3{font-size:14px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em}
.brand b{display:block;font-size:14px}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.count{font-size:11px;font-family:var(--f-mono);background:var(--sunk);padding:1px 6px;border-radius:10px;color:var(--muted)}
.rolebox{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.rolebox select{width:100%}
.rolebox p{margin:0;font-size:11.5px;color:var(--muted)}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-size:12px;font-weight:500}
.linkbtn:hover{text-decoration:underline}

main{padding-block:24px 60px;padding-inline:28px;min-width:0;display:flex;flex-direction:column;gap:20px}
.topline{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.topline .sub{margin:4px 0 0;color:var(--muted)}

.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

input[type=text],input[type=number],input[type=date],input[type=url],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
textarea{resize:vertical;width:100%}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search]{flex:1 1 220px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-b{padding:16px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
th button{all:unset;cursor:pointer}
th button:hover{color:var(--ink)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
tr.batch td{background:var(--accent-soft);padding-block:8px;font-size:12.5px;border-bottom-color:transparent}
tr.member td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.mute{background:var(--sunk);color:var(--muted)}
.pill.batchp{background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
.miss{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);border:1px dashed var(--warn);padding:1px 6px;border-radius:4px;white-space:nowrap}
.restricted{font-size:11.5px;color:var(--muted);background:repeating-linear-gradient(-45deg,var(--sunk) 0 4px,transparent 4px 8px);padding:2px 6px;border-radius:4px;white-space:nowrap}
.flags{display:flex;flex-wrap:wrap;gap:4px}
.mini{display:flex;gap:2px;margin-top:5px}
.mini i{display:block;width:9px;height:4px;border-radius:2px;background:var(--line)}
.mini i.d{background:var(--accent)}
.mono,.nowrap{white-space:nowrap}
.tip{border-bottom:1px dotted currentColor;cursor:help}
.demo{display:inline-block;font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:20px;margin:0 6px}
.guide{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.guide-h{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:baseline;padding:14px 16px 0}
.guide-h p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.phases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:14px 16px}
.phase{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:6px;background:var(--bg);min-width:0}
.phase .n{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.phase b{font-weight:600}
.phase p{margin:0;font-size:12.5px;color:var(--muted)}
.whochip{align-self:flex-start;font-size:11px;font-weight:600;padding:1px 8px;border-radius:20px;border:1px solid var(--line);color:var(--ink);background:var(--surface)}
.terms{border-top:1px solid var(--line);padding:12px 16px 14px}
.terms dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 24px;margin:12px 0 0}
.terms dt{font-weight:600;font-size:13px}
.terms dd{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.tabhelp{margin-top:-8px}
.next .eyebrow{display:block;margin-bottom:4px}
@media (max-width:1100px){.phases{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.phases{grid-template-columns:1fr}}

/* case file */
.back{all:unset;cursor:pointer;color:var(--muted);font-size:13px}
.back:hover{color:var(--ink)}
.casehead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:flex-start}
.casehead .meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;color:var(--muted);font-size:13px}
.casehead .meta b{color:var(--ink);font-weight:500}
.batchbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border:1px dashed var(--accent);border-radius:var(--r);background:var(--surface);font-size:13px}
.batchbar .who{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;font-size:12.5px;padding:2px 9px;border-radius:20px;background:var(--sunk);color:var(--ink)}
.chip:hover{background:var(--accent-soft);color:var(--accent)}
.chip.me{background:var(--accent);color:var(--accent-ink);cursor:default}
.chip:focus-visible{outline:2px solid var(--accent)}
.stepper{display:grid;grid-template-columns:repeat(9,minmax(96px,1fr));gap:0;overflow-x:auto;padding-bottom:4px}
.step{position:relative;padding:14px 8px 0 0;font-size:12px}
.step::before{content:"";position:absolute;top:4px;left:0;right:0;height:3px;background:var(--line)}
.step.done::before{background:var(--accent)}
.step.cur::before{background:linear-gradient(90deg,var(--accent) 50%,var(--line) 50%)}
.step .dot{position:absolute;top:0;left:0;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.step.done .dot{background:var(--accent);border-color:var(--accent)}
.step.cur .dot{border-color:var(--accent);background:var(--accent-soft)}
.step b{display:block;font-weight:500;line-height:1.25}
.step.todo b{color:var(--muted)}
.step span{color:var(--muted);font-size:11px;font-family:var(--f-mono)}
.step em{display:block;font-style:normal;font-size:10.5px;color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}

.next{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r)}
.next.hold{border-color:var(--warn);background:var(--warn-soft)}
.next p{margin:3px 0 0;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px 22px}
.kv div{display:flex;flex-direction:column;gap:3px;min-width:0}
.kv dt{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kv dd{margin:0;overflow-wrap:anywhere}
.stack{display:flex;flex-direction:column;gap:16px}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.note{font-size:12.5px;color:var(--muted);margin:0}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:6px;font-size:13px;background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn)}
.banner.info{background:var(--info-soft);border-left-color:var(--info)}
.banner.ok{background:var(--ok-soft);border-left-color:var(--ok)}
.trend{font-weight:600;white-space:nowrap}
.trend.up{color:var(--ok)} .trend.down{color:var(--crit)} .trend.stable{color:var(--info)}
.subj{display:block;font-size:12px;color:var(--muted);max-width:280px}
.subj a{color:var(--info)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.list li:last-child{border-bottom:0}
.list .when{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-width:118px}
.task{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:16px;height:16px;margin-top:2px;accent-color:var(--accent)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;padding:4px 0}
.check .ic{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.check .ic.y{background:var(--ok);color:var(--surface)}
.check .ic.n{border:2px solid var(--line)}
.decide label{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:10px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.decide label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.decide input{accent-color:var(--accent);margin-top:3px}
.decide fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0;display:flex;flex-direction:column;gap:8px}
.decide legend{font-weight:600;padding:0 6px}
.cell-none{color:var(--line)}
.pick{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.pick:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pick input{accent-color:var(--accent);margin-top:3px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,15,13,.45);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(660px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.modal-b{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
details summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--accent)}
details[open] summary{margin-bottom:12px}
.mail{border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:13px}
.mail .row{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;padding:6px 12px;border-bottom:1px solid var(--line)}
.mail .row span:first-child{color:var(--muted)}
.mail .body{padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:1100px){.two{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}
  .nav{flex-direction:row;flex-wrap:wrap;order:3;width:100%}
  .rolebox{margin:0 0 0 auto;padding:6px 8px;flex-direction:row;align-items:center}
  .rolebox p,.rolebox .eyebrow,.rolebox .linkbtn{display:none}
  main{padding-inline:16px}
  .grid2{grid-template-columns:1fr}
  .next{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="root"></div>
<input type="file" id="pollfile" accept=".csv,text/csv" hidden>

<script>
const H = 36e5, D = 864e5;
const STAGES = ['Resignation Logged','Bid Open','Bid Closed','Data Compilation','Sent for Approval','CSM Assigned','Target Email Sent','Handover in Progress','Completed'];
const SHARED_UPTO = 4; // stages 0–4 run together for every case in a batch; the decision moves all to stage 5 at once
const ROLES = {
  hr:{label:'HR / Process Owner', who:'Tanya J. (HR)'},
  approver:{label:'Sakshi (Approver)', who:'Sakshi'},
  viewer:{label:'CSM (restricted)', who:'CSM viewer'}
};
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = t => { if (t == null) return '—'; const d = new Date(t); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const fmtDT = t => { if (t == null) return '—'; const d = new Date(t); return `${d.getDate()} ${MON[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const rel = t => { const diff = t - Date.now(), a = Math.abs(diff); const s = a < H ? Math.max(1, Math.round(a/6e4))+'m' : a < 2*D ? Math.round(a/H)+'h' : Math.round(a/D)+'d'; return diff >= 0 ? 'in '+s : s+' ago'; };
const lakh = v => v == null ? '' : '₹' + (+v).toFixed(1) + ' L';
const MISS = label => `<span class="miss" title="Not provided. Do not treat as zero.">⚠ Missing${label ? ' ' + esc(label) : ''}</span>`;
const RESTRICT = '<span class="restricted" title="Visible to HR and the approver only">Restricted</span>';

/* ---------- bidder pool (sample people) ---------- */
const POOL = {
  aditi:   {name:'Aditi Sharma',   role:'CSM', ceiling:52, csmIndex:1.12, asmIndex:null, papip:{status:'None',detail:'No PAPIP on record'}, prev:[{caseId:'TKO-2025-031', subject:'Takeover allocation: Logistics East (Sahil Arora)', trend:'up'}], trend:'up'},
  rahul:   {name:'Rahul Verma',    role:'CSM', ceiling:45, csmIndex:0.94, asmIndex:null, papip:{status:'Closed',detail:'PAPIP Q1 FY26, closed as met'}, prev:[{caseId:'TKO-2025-024', subject:'Takeover allocation: SMB Central (Isha Kulkarni)', trend:'down'}], trend:'down'},
  meera:   {name:'Meera Iyer',     role:'CSM', ceiling:60, csmIndex:1.21, asmIndex:null, papip:{status:'None',detail:'No PAPIP on record'}, prev:[{caseId:'TKO-2025-018', subject:'Takeover allocation: Telecom North (Gaurav Pandey)', trend:'up'},{caseId:'TKO-2026-004', subject:'Takeover allocation: EdTech (Ritu Saxena)', trend:'up'}], trend:'up'},
  siddharth:{name:'Siddharth Jain',role:'CSM', ceiling:38, csmIndex:0.88, asmIndex:null, papip:{status:'Active',detail:'Active since Aug 2026, review on 30 Nov'}, prev:[], trend:null},
  pooja:   {name:'Pooja Bansal',   role:'CSM', ceiling:49, csmIndex:1.03, asmIndex:null, papip:{status:'None',detail:'No PAPIP on record'}, prev:[{caseId:'TKO-2025-040', subject:'Takeover allocation: Hospitality (Varun Bhatt)', trend:'stable'}], trend:'stable'},
  nikhil:  {name:'Nikhil Gupta',   role:'CSM', ceiling:41, csmIndex:null, asmIndex:null, papip:null, prev:null, trend:null},
  farah:   {name:'Farah Khan',     role:'CSM', ceiling:55, csmIndex:1.08, asmIndex:null, papip:{status:'None',detail:'No PAPIP on record'}, prev:[{caseId:'TKO-2025-012', subject:'Takeover allocation: Media West (Ajay Menon)', trend:'stable'},{caseId:'TKO-2026-002', subject:'Takeover allocation: Auto OEM (Sunil Thakur)', trend:'up'}], trend:'up'},
  deepak:  {name:'Deepak Rawat',   role:'ASM', ceiling:30, csmIndex:null, asmIndex:1.15, papip:{status:'None',detail:'No PAPIP on record'}, prev:[], trend:null},
  kavya:   {name:'Kavya Reddy',    role:'ASM', ceiling:34, csmIndex:null, asmIndex:null, papip:{status:'None',detail:'No PAPIP on record'}, prev:null, trend:null}

let localPending = 0;
async function localDB(){

    localPending++;
    try {
      const r = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body:body ? JSON.stringify(body) : undefined});
      if (!r.ok) throw {code: r.status === 400 ? 'invalid_argument' : 'unavailable'};
    } catch(e) { throw e?.code ? e : {code:'unavailable'}; }
    finally { localPending--; }
  };
  return {
    doc: p => { const [col, id] = p.split('/'), url = 'api/' + col + '/' + encodeURIComponent(id); return { set: d => call('PUT', url, d), delete: () => call('DELETE', url) }; },
    collection: col => ({ onSnapshot(next){
      let last = null, stop = false;
      const tick = async () => {
        if (stop) return;
        if (!localPending) try {
          const r = await fetch('api/' + col, {cache:'no-store'}), txt = await r.text();
          if (r.ok && txt !== last && !localPending) { last = txt; next({docs: JSON.parse(txt).map(x => ({data: () => x}))}); }

  if (c.exception === 'Cancelled') return {text:'Cancelled: ' + c.holdReason};
  if (c.exception === 'On Hold') return {text:'On hold: ' + c.holdReason};
  const due = dueOf(c), when = due ? 'by ' + fmtS(due) : '';
  const done = c.tasks.filter(t => t.status === 'done').length;
  return [
    {text:'Send the bid email to all CSMs', who:'HR', when},
    {text:`Bids coming in, ${c.bids.length} so far`, who:'CSMs and ASMs', when:Date.now() < c.bid?.closeAt ? 'closes ' + rel(c.bid.closeAt) : 'window ended, close bidding'},
    {text:'Start comparing the bids', who:'HR', when},
    {text:caseMissing(c) ? 'Fill missing bidder data, then send to Sakshi' : 'Send the comparison to Sakshi', who:'HR', when},
    {text:'Sakshi to choose the new CSM', who:'Sakshi', when:'pack sent ' + rel(c.packs.at(-1)?.at)},
    {text:`Send the target email to ${c.incoming}`, who:'HR', when},
    {text:`Get ${c.incoming}'s acknowledgement`, who:'HR', when},
    {text:`Handover: ${done} of ${c.tasks.length} tasks done`, who:'HR and both CSMs', when:'finish by ' + fmtS(c.lwd)},
    {text:'Completed on ' + fmtS(c.closedAt)}
  ][c.stage];
}

async function loadEmployees(refresh){

    const r = await fetch('api/employees' + (refresh ? '?refresh=1' : ''), {cache:'no-store'});

}

function casesView(){
  const all = S.cases;
  const q = S.q.trim().toLowerCase();
  const rows = all.filter(c => {
    if (q && ![c.id, c.batchId, c.outgoing.emp, c.outgoing.name, c.portfolio.name, c.pms, c.owner, c.incoming].join(' ').toLowerCase().includes(q)) return false;
    if (S.stageF !== 'all' && !(S.stageF === 'exc' ? c.exception : !c.exception && String(c.stage) === S.stageF)) return false;
    if (S.flagF === 'batch' && !inBatch(c)) return false;

  rows.forEach(c => {

      seen.add(c.batchId);

function batchBar(c){

const TAB_HELP = {
  bids:'Responses from the bidding poll. Bidding stays open for 24 hours after the bid email is sent.',
  compare:'Side-by-side view of every bidder, with their performance history. HR fills any gaps before sending this to Sakshi.',
  approval:'What was sent to Sakshi, and the new CSM she chose.',
  handover:"The new CSM's revised target and the handover checklist. The case can be closed once every item is done.",
  comms:'Every email sent for this case: bid email, approval pack, target email and follow-ups.',
  activity:'A permanent record of who did what and when. Entries cannot be edited or deleted.'
};
function nextCard(c){
  if (c.exception === 'Cancelled') return `<div class="next hold"><div><h3>Case cancelled</h3><p>${esc(c.holdReason)}</p></div></div>`;
  if (c.exception === 'On Hold') return `<div class="next hold"><div><h3>On hold</h3><p>${esc(c.holdReason)}.${c.batchId ? ' This case is left out of batch actions while on hold.' : ''}</p></div><div class="btnrow"><button class="btn primary" data-act="resume" ${isHR() ? '' : 'disabled'}>Resume case</button></div></div>`;
  const due = dueOf(c), hr = isHR() ? '' : 'disabled title="HR / Process Owner only"';
  const g = group(c), all = forAll(c), nb = g.reduce((n, x) => n + x.bids.length, 0), nm = g.reduce((n, x) => n + caseMissing(x), 0);
  const dueTxt = due ? ` Due ${fmtDT(due)}.` : '';

    0: [g.length > 1 ? `Open bidding for all ${g.length} portfolios` : 'Open bidding', g.length > 1 ? 'One combined bid-open email goes to all CSMs with a single poll covering every portfolio in this batch. Sending it starts one 24-hour window.' : 'Generate the bid-open email with the poll link. Sending it starts the 24-hour window. If another CSM resigns before you send it, add that resignation to this takeover so both run together.', `<button class="btn primary" data-act="gen-bid" ${hr}>Generate ${g.length > 1 ? 'combined ' : ''}bid email</button>`],

    2: ['Enrich bidder data', 'Add PAPIP status, previous takeovers and their trend for each bidder.', `<button class="btn primary" data-act="start-compile" ${hr}>Start data compilation${all}</button>`],
    3: [g.length > 1 ? 'Compile one approval pack for the batch' : 'Compile the approval pack', nm ? `${nm} data points are still missing${g.length > 1 ? ' across the batch' : ''}. You can still send, and they will show as missing.` : 'All comparison fields are filled.', `<button class="btn" data-act="tab" data-t="compare">Review comparison</button><button class="btn primary" data-act="send-approval" ${hr}>Send ${g.length > 1 ? 'combined ' : ''}pack to Sakshi</button>`],
    4: ["Waiting for Sakshi's decision", `Pack v${c.packs.at(-1)?.v} sent ${fmtDT(c.packs.at(-1)?.at)}.${g.length > 1 ? ` Sakshi allocates all ${g.length} portfolios in one decision.` : ''}`, S.role === 'approver' ? `<button class="btn primary" data-act="tab" data-t="approval">Review and decide</button>` : `<button class="btn" data-act="send-approval" ${hr}>Send revised pack</button><button class="btn primary" data-act="tab" data-t="approval">Open approval</button>`],
    5: ['Send revised target email', `${esc(c.incoming)} was selected. Prepare the allocation and revised target email.`, `<button class="btn primary" data-act="prep-target" ${hr}>Prepare target email</button>`],
    6: ['Confirm acknowledgement', `Target email sent ${fmtDT(c.target?.sentAt)}. ${c.target?.ackAt ? 'Acknowledged.' : 'Not yet acknowledged.'}`, `${c.target?.ackAt ? '' : `<button class="btn" data-act="ack-target" ${hr}>Record acknowledgement</button>`}<button class="btn primary" data-act="start-handover" ${hr}>Start handover</button>`],
    7: ['Track handover to closure', `${c.tasks.filter(t => t.status === 'done').length} of ${c.tasks.length} tasks done${c.tasks.some(t => t.status === 'blocked') ? ', 1 or more blocked' : ''}.`, `<button class="btn primary" data-act="tab" data-t="handover">Open handover</button>`],

  }[c.stage];
  return `<div class="next"><div><span class="eyebrow">${c.stage < 8 ? `Next step · done by ${WHO_ACTS[c.stage]}` : 'Status'}</span><h3>${A[0]}</h3><p>${A[1]}${c.stage < 8 ? dueTxt : ''}</p></div><div class="btnrow">${A[2]}</div></div>`;
}

function batchMatrix(c){
  if (!inBatch(c)) return '';
  const cols = members(c.batchId).filter(x => x.bid);

function alsoBid(c, b){
  if (!inBatch(c)) return '';
  const others = members(c.batchId).filter(x => x.id !== c.id && x.bids.some(y => y.name === b.name)).map(x => x.portfolio.name);
  return others.length ? `<div class="muted" style="font-size:11.5px">Also bid: ${esc(others.join(', '))}</div>` : '';
}

function sortedBids(c){
  const k = S.sort.key, dir = S.sort.dir, arr = [...c.bids];
  if (!k) return arr;
  const val = b => k === 'name' ? b.name : k === 'index' ? idxOf(b) : b[k];
  return arr.sort((a, b) => { const x = val(a), y = val(b); if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * dir; });
}
function compareTab(c){

  const editable = isHR() && c.stage >= 2 && c.stage <= 4;
  return `<div class="stack">
  ${miss ? `<div class="banner"><span><b>${miss} data points missing.</b> They are shown as missing, never as zero. Fill them from PAPIP records and previous takeover emails before sending the pack.</span></div>` : '<div class="banner ok">All comparison fields are filled for every bidder.</div>'}
  ${!sens ? '<div class="banner info">PAPIP and takeover performance are restricted to HR and the approver.</div>' : ''}
  <div class="panel">
    <div class="panel-h"><h2>Bid comparison${inBatch(c) ? ': ' + esc(c.portfolio.name) : ''}</h2><div class="btnrow">${inBatch(c) ? `<span class="muted" style="font-size:12.5px">Other portfolios in ${c.batchId}:</span>${members(c.batchId).filter(x => x.id !== c.id).map(x => `<button class="chip" data-act="open-case" data-id="${x.id}" data-t="compare">${esc(x.portfolio.name)}</button>`).join('')}` : ''}<button class="btn sm" data-act="copy-bids">Copy as CSV</button></div></div>
    <div class="tablewrap"><table>
      <thead><tr>${sh('name','Bidder')}<th>Role</th>${sh('bid','Bid')}${sh('ceiling','Ceiling')}${sh('index','Index')}<th>${term('PAPIP', tipOf('PAPIP'))}</th><th>Previous takeovers and email evidence</th><th>${term('Trend', tipOf('Trend'))}</th><th>${term('Data', tipOf('⚠ Missing'))}</th>${editable ? '<th></th>' : ''}</tr></thead>
      <tbody>${sortedBids(c).map(b => {
        const m = missingOf(b), sel = c.decision?.bidderId === b.id;
        return `<tr>
        <td><b style="font-weight:500">${esc(b.name)}</b>${alsoBid(c, b)}${sel ? '<div><span class="pill ok">Selected by Sakshi</span></div>' : ''}${b.eligible === false ? '<div><span class="pill mute">Not eligible</span></div>' : ''}</td>
        <td>${b.role}</td>
        <td class="num"><b style="font-weight:600">${lakh(b.bid)}</b></td>
        <td class="num">${b.ceiling == null ? MISS() : lakh(b.ceiling)}</td>
        <td class="num">${idxOf(b) == null ? MISS() : `${idxOf(b).toFixed(2)} <span class="muted" style="font-size:11px">${b.role}</span>`}</td>
        <td>${!sens ? RESTRICT : b.papip == null ? MISS() : `<span class="pill ${b.papip.status === 'Active' ? 'crit' : b.papip.status === 'Closed' ? 'mute' : 'ok'}">${esc(b.papip.status)}</span><span class="subj">${esc(b.papip.detail)}</span>`}</td>
        <td>${!sens ? RESTRICT : b.prev == null ? MISS() : !b.prev.length ? '<span class="muted">No prior takeovers</span>' : b.prev.map(p => `<span class="subj"><span class="mono">${esc(p.caseId)}</span> <span class="trend ${p.trend}">${arrow(p.trend)}</span><br><a href="#" data-act="noop">“${esc(p.subject)}”</a></span>`).join('')}</td>
        <td>${!sens ? RESTRICT : b.prev && !b.prev.length ? '<span class="muted">n/a</span>' : b.trend == null ? MISS() : `<span class="trend ${b.trend}">${arrow(b.trend)} ${cap(b.trend)}</span>`}</td>
        <td>${m.length ? `<span class="miss" title="${esc(m.join(', '))}">⚠ ${m.length}</span>` : '<span class="pill ok">Complete</span>'}</td>
        ${editable ? `<td><button class="btn sm" data-act="edit-bid" data-id="${b.id}">Edit</button></td>` : ''}
      </tr>`;}).join('')}</tbody>
    </table></div>
  </div>
  <p class="note">The dashboard does not rank bidders or suggest a winner. Sorting is for reading only. Sakshi makes the final selection.</p>
  </div>`;
}
const arrow = t => t === 'up' ? '▲' : t === 'down' ? '▼' : t === 'stable' ? '▬' : '';
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
const bidLine = b => `Bid ${lakh(b.bid)} · Ceiling ${b.ceiling == null ? 'missing' : lakh(b.ceiling)} · Index ${idxOf(b) == null ? 'missing' : idxOf(b).toFixed(2)} · PAPIP ${b.papip?.status || 'missing'} · Trend ${b.prev && !b.prev.length ? 'no prior' : b.trend || 'missing'}`;

function approvalTab(c){

      <div><dt>Selected CSM</dt><dd><b>${esc(b?.name || c.incoming)}</b> (${b?.role || ''})</dd></div>

        ${x.bids.filter(b => b.eligible !== false).map(b => `<label><input type="radio" name="pick-${x.id}" value="${b.id}" data-name="${esc(b.name)}"><span><b style="font-weight:500">${esc(b.name)}</b> <span class="muted">${b.role}</span><br><span class="muted num" style="font-size:12.5px">${bidLine(b)}</span></span></label>`).join('') || '<p class="muted" style="margin:0">No eligible bidders.</p>'}
      </fieldset>`).join('')}

}

function handoverTab(c){

      </dl></div></div>

        ${c.stage === 7 ? `<div class="btnrow" style="margin-top:12px"><button class="btn primary" data-act="close-case" ${canClose ? '' : 'disabled'}>Mark case completed</button></div>${!canClose ? '<p class="note" style="margin-top:6px">Completes only after every checkpoint is confirmed.</p>' : ''}` : c.stage === 8 ? `<p class="note" style="margin-top:8px">Closed ${fmtDT(c.closedAt)}.</p>` : ''}
        ${blocked.length ? `<p class="note" style="margin-top:8px;color:var(--crit)">${blocked.length} blocked task${blocked.length > 1 ? 's' : ''}.</p>` : ''}
      </div></div>
  </div></div>`;

const closureChecks = c => [

function approvalsView(){

function modal(title, body, foot, onMount){
  closeModal();
  const el = document.createElement('div');
  el.className = 'scrim'; el.id = 'scrim';
  el.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h2>${esc(title)}</h2><button class="btn sm" data-act="close-modal" aria-label="Close">✕</button></div><div class="modal-b">${body}</div><div class="modal-f">${foot}</div></div>`;
  document.body.appendChild(el);
  el.addEventListener('click', e => { if (e.target === el) closeModal(); });
  onMount && onMount(el);
  const f = el.querySelector('input,select,textarea'); f && f.focus();
}
function closeModal(){ document.getElementById('scrim')?.remove(); }
let tt;
function toast(msg){ document.querySelector('.toast')?.remove(); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); clearTimeout(tt); tt = setTimeout(() => t.remove(), 2800); }

    // one person's history applies to every portfolio they bid on in the batch
    if (inBatch(c)) members(c.batchId).forEach(x => x.bids.filter(y => y.name === b.name && y !== b).forEach(y => Object.assign(y, {ceiling:b.ceiling, csmIndex:b.csmIndex, asmIndex:b.asmIndex, papip:b.papip, prev:JSON.parse(JSON.stringify(b.prev)), trend:b.trend})));
    log(c, `Bidder data updated: ${b.name} (${missingOf(b).length} fields still missing)`); closeModal(); commit('Saved');
  },
  'send-approval': () => {
    const c = cur(), g = group(c), v = c.packs.length + 1, miss = g.reduce((n, x) => n + caseMissing(x), 0);
    const subj = g.length > 1 ? `Takeover approval pack v${v}: batch ${c.batchId} (${g.length} portfolios)` : `Takeover approval pack v${v}: ${c.portfolio.name} (${c.outgoing.name})`;
    modal(`Send approval pack v${v} to Sakshi`, `
      ${miss ? `<div class="banner"><span><b>${miss} data points are missing.</b> They will appear as missing in the pack.</span></div>` : ''}
      <div class="mail">
        <div class="row"><span>To</span><span>Sakshi</span></div>
        <div class="row"><span>Subject</span><span>${esc(subj)}</span></div>
        <div class="row"><span>Attached</span><span>Bid comparison v${v}.xlsx${g.length > 1 ? ' (one sheet per portfolio)' : ''} · Poll export · Previous takeover trail</span></div>
        <div class="body">Hi Sakshi,

${g.length > 1 ? `${g.length} CSMs resigned together, so their takeovers are in one pack:\n${g.map((x, i) => `${i + 1}. ${esc(x.portfolio.name)} (${esc(x.outgoing.name)}, LWD ${fmtD(x.lwd)}): ${x.bids.length} bids`).join('\n')}` : `${c.bids.length} bids were received for ${esc(c.outgoing.name)}'s portfolio (LWD ${fmtD(c.lwd)}).`}

The comparison covers bid amount, ceiling, CSM/ASM index, PAPIP status and previous takeover trends, with the supporting email threads.

Please confirm the incoming CSM${g.length > 1 ? ' for each portfolio' : ''}.</div>
      </div>
      <p class="note">The approval email format and decision capture are open items.</p>`,
      `<button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" data-act="do-send-approval">Mark as sent</button>`);
  },
  'do-send-approval': () => {
    const c = cur(), g = group(c), v = c.packs.length + 1, n = Date.now(), th = thread();
    const subj = g.length > 1 ? `Takeover approval pack v${v}: batch ${c.batchId} (${g.length} portfolios)` : `Takeover approval pack v${v}: ${c.portfolio.name} (${c.outgoing.name})`;
    g.forEach(x => {
      x.packs.push({v, at:n, by:who(), bidders:x.bids.length, missing:caseMissing(x), batch:g.length > 1 ? x.batchId : null});
      x.comms.push({id:nid('m'), at:n, template:'Approval pack', subject:subj, to:'Sakshi', thread:th, attachments:[`Bid comparison v${v}.xlsx`, ...x.attachments.map(a => a.name)]});
      log(x, g.length > 1 ? `Combined approval pack v${v} for batch ${x.batchId} sent to Sakshi` : `Approval pack v${v} sent to Sakshi`);
      if (x.stage !== 4) setStage(x, 4); else x.stageAt[4] = n;
    });
    closeModal(); commit(`Pack v${v} sent to Sakshi${forAll(c, g.length)}`);
  },
  'prep-target': () => {
    const c = cur(), b = c.bids.find(x => x.id === c.decision.bidderId), prev = b?.ceiling ?? 0, add = c.portfolio.target ?? 0;
    const other = inBatch(c) ? members(c.batchId).filter(x => x.id !== c.id && x.incoming === c.incoming) : [];
    modal('Revised target email', `
      <div class="banner">The target calculation and email template are open items. Figures below are editable.</div>
      ${other.length ? `<div class="banner info">${esc(c.incoming)} was also allocated ${esc(other.map(x => x.portfolio.name).join(', '))} in this batch. Check the combined target.</div>` : ''}
      <div class="grid2">
        <div class="field"><label for="tg-prev">${esc(c.incoming)}'s current target (₹ L)</label><input type="number" id="tg-prev" step="0.1" value="${prev}"></div>
        <div class="field"><label for="tg-add">Added from portfolio (₹ L)</label><input type="number" id="tg-add" step="0.1" value="${add}"></div>
        <div class="field"><label for="tg-amt">Revised target (₹ L / quarter)</label><input type="number" id="tg-amt" step="0.1" value="${(prev + add).toFixed(1)}"></div>
        <div class="field"><label for="tg-period">Period</label><select id="tg-period"><option>Q3 FY27 (Oct to Dec 2026)</option><option>Q4 FY27 (Jan to Mar 2027)</option></select></div>
      </div>
      <div class="mail"><div class="row"><span>To</span><span>${esc(c.incoming)}; cc ${esc(c.manager)}</span></div><div class="row"><span>Subject</span><span>Portfolio allocation and revised target: ${esc(c.portfolio.name)}</span></div></div>`,
      '<button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" data-act="send-target">Mark as sent</button>', el => {
        const sync = () => { el.querySelector('#tg-amt').value = ((+el.querySelector('#tg-prev').value || 0) + (+el.querySelector('#tg-add').value || 0)).toFixed(1); };
        el.querySelector('#tg-prev').addEventListener('input', sync); el.querySelector('#tg-add').addEventListener('input', sync);
      });
  },
  'send-target': () => {
    const c = cur(), n = Date.now(), th = thread();
    c.target = {amount:+val('tg-amt'), previous:+val('tg-prev'), added:+val('tg-add'), period:val('tg-period'), sentAt:n, thread:th, ackAt:null};
    c.comms.push({id:nid('m'), at:n, template:'Revised target (draft)', subject:`Portfolio allocation and revised target: ${c.portfolio.name}`, to:`${c.incoming}; cc ${c.manager}`, thread:th, attachments:['Account list.xlsx']});
    log(c, `Revised target email sent to ${c.incoming} (${lakh(c.target.amount)}, ${c.target.period})`);
    c.tasks = defaultTasks(c, n);
    setStage(c, 6); closeModal(); commit('Target email logged');
  },
  'ack-target': () => { const c = cur(); c.target.ackAt = Date.now(); log(c, `Target email acknowledged by ${c.incoming}`); commit('Acknowledgement recorded'); },
  'start-handover': () => { const c = cur(); setStage(c, 7); S.tab = 'handover'; commit('Handover started'); },
  'task-block': d => {
    const c = cur(), t = c.tasks.find(x => x.id === d.id);
    if (t.status === 'blocked') { t.status = 'todo'; t.blocker = ''; log(c, 'Task unblocked: ' + t.title); commit('Unblocked'); return; }
    modal('Mark task blocked', `<div class="field"><label for="bl-why">What is blocking "${esc(t.title)}"?</label><input type="text" id="bl-why"></div>`, `<button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" data-act="do-block" data-id="${t.id}">Mark blocked</button>`);
  },
  'do-block': d => { const c = cur(), t = c.tasks.find(x => x.id === d.id); t.status = 'blocked'; t.blocker = val('bl-why') || 'Reason not given'; log(c, `Task blocked: ${t.title} (${t.blocker})`); closeModal(); commit('Marked blocked'); },
  'close-case': () => {
    const c = cur(), n = Date.now();
    c.comms.push({id:nid('m'), at:n, template:'Handover completion', subject:`Takeover completed: ${c.portfolio.name}`, to:`${c.incoming}; ${c.outgoing.name}; ${c.manager}`, thread:thread(), attachments:[]});
    c.closedAt = n; log(c, 'Case closed. All handover checkpoints confirmed.'); setStage(c, 8); commit('Case completed');
  },
  'log-email': () => {
    modal('Log an email', `
      <div class="field"><label for="le-subj">Subject</label><input type="text" id="le-subj"></div>
      <div class="grid2">
        <div class="field"><label for="le-tpl">Type</label><select id="le-tpl"><option>Handover follow-up</option><option>Handover completion</option><option>Reminder</option><option>Escalation</option><option>Other</option></select></div>
        <div class="field"><label for="le-thread">Outlook thread / link</label><input type="text" id="le-thread" placeholder="OL-00000"></div>
      </div>
      <div class="field"><label for="le-to">Recipients</label><input type="text" id="le-to"></div>
      <div class="field"><label for="le-att">Attachments (comma separated)</label><input type="text" id="le-att"></div><p class="note" id="le-err"></p>`,
      '<button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" data-act="save-email">Log email</button>');
  },
  'save-email': () => {
    if (!val('le-subj') || !val('le-to')) { err('le-err', 'Add a subject and recipients.'); return; }
    const c = cur();
    c.comms.push({id:nid('m'), at:Date.now(), template:val('le-tpl'), subject:val('le-subj'), to:val('le-to'), thread:val('le-thread') || '—', attachments:val('le-att') ? val('le-att').split(',').map(s => s.trim()).filter(Boolean) : []});
    log(c, `Email logged: ${val('le-subj')}`); closeModal(); commit('Email logged');
  },
  hold: () => modal('Put case on hold', `<div class="field"><label for="h-why">Reason</label><input type="text" id="h-why" placeholder="e.g. Resignation withdrawal under discussion"></div>${inBatch(cur()) && cur().stage <= SHARED_UPTO ? '<p class="note">The rest of the batch carries on without this case.</p>' : ''}`, '<button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" data-act="do-hold" data-x="On Hold">Put on hold</button>'),
  cancel: () => modal('Cancel case', '<div class="field"><label for="h-why">Reason</label><input type="text" id="h-why" placeholder="e.g. Resignation withdrawn"></div><p class="note">The case and its audit trail are kept.</p>', '<button class="btn" data-act="close-modal">Keep case</button><button class="btn danger" data-act="do-hold" data-x="Cancelled">Cancel case</button>'),
  'do-hold': d => { const c = cur(); c.exception = d.x; c.holdReason = val('h-why') || 'No reason given'; log(c, `Case ${d.x === 'Cancelled' ? 'cancelled' : 'put on hold'}: ${c.holdReason}`); closeModal(); commit(d.x === 'Cancelled' ? 'Case cancelled' : 'Case on hold'); },
  resume: () => { const c = cur(); c.exception = null; log(c, 'Case resumed'); commit('Case resumed'); },
  'copy-list': () => copyCSV([['Case','Batch','PMS ref','Outgoing CSM','Portfolio','Resigned','LWD','Stage','Owner','Next due','Incoming CSM'],
    ...S.cases.map(c => [c.id, c.batchId || '', c.pms, c.outgoing.name, c.portfolio.name, fmtD(c.resignDate), fmtD(c.lwd), c.exception || STAGES[c.stage], c.owner, fmtDT(dueOf(c)), c.incoming || ''])]),
  'copy-bids': () => { const c = cur(), s = sensitive(); copyCSV([['Portfolio','Bidder','Role','Bid (L)','Ceiling (L)','Index','PAPIP','Previous takeovers','Trend','Missing'],
    ...c.bids.map(b => [c.portfolio.name, b.name, b.role, b.bid, b.ceiling ?? 'MISSING', idxOf(b) ?? 'MISSING', !s ? 'Restricted' : b.papip?.status ?? 'MISSING', !s ? 'Restricted' : b.prev == null ? 'MISSING' : b.prev.map(p => p.subject).join(' | ') || 'None', !s ? 'Restricted' : b.trend ?? (b.prev && !b.prev.length ? 'n/a' : 'MISSING'), missingOf(b).join('; ')])]); }
};
function copyCSV(rows){
  const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const fallback = () => modal('Copy CSV', `<p class="note">Select all and copy.</p><textarea id="csv-out" rows="10" readonly>${esc(csv)}</textarea>`, '<button class="btn" data-act="close-modal">Done</button>', el => el.querySelector('#csv-out').select());
  try { navigator.clipboard.writeText(csv).then(() => toast(`Copied ${rows.length - 1} rows as CSV`), fallback); } catch(e) { fallback(); }
}
function dupWarn(){
  const box = document.getElementById('dup-warn'); if (!box) return;
  const count = {};
  document.querySelectorAll('#decide-form input[type=radio]:checked').forEach(r => count[r.dataset.name] = (count[r.dataset.name] || 0) + 1);
  const dup = Object.entries(count).filter(([, n]) => n > 1);
  box.innerHTML = dup.length ? `<div class="banner"><span>${dup.map(([nm, n]) => `<b>${esc(nm)}</b> is selected for ${n} portfolios. That is allowed. Check their capacity before recording.`).join('<br>')}</span></div>` : '';
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  if (t.tagName === 'A') e.preventDefault();
  const f = ACT[t.dataset.act]; if (f) f(t.dataset);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act]')) { e.preventDefault(); ACT['open-case'](e.target.dataset); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q' || e.target.id === 'empq') {
    const id = e.target.id; if (id === 'q') S.q = e.target.value; else EMP.q = e.target.value;
    const pos = e.target.selectionStart; render(); const q = document.getElementById(id); q.focus(); q.setSelectionRange(pos, pos);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'role-select') { S.role = t.value; commit('Viewing as ' + ROLES[S.role].label); }
  else if (t.id === 'stageF') { S.stageF = t.value; render(); }
  else if (t.id === 'flagF') { S.flagF = t.value; render(); }
  else if (t.id === 'empDept') { EMP.dept = t.value; render(); }
  else if (t.closest('#decide-form')) dupWarn();
  else if (t.dataset.elig) { const c = cur(), b = c.bids.find(x => x.id === t.dataset.elig); b.eligible = JSON.parse(t.value); log(c, `Eligibility for ${b.name} set to ${b.eligible == null ? 'unreviewed' : b.eligible ? 'eligible' : 'not eligible'}`); commit(); }
  else if (t.dataset.task) { const c = cur(), k = c.tasks.find(x => x.id === t.dataset.task); k.status = t.checked ? 'done' : 'todo'; if (t.checked) k.blocker = ''; log(c, `Task ${t.checked ? 'completed' : 'reopened'}: ${k.title}`); commit(); }
  else if (t.id === 'pollfile' && t.files[0]) {
    const file = t.files[0], r = new FileReader();
    r.onload = () => {
      const c = cur(), g = group(c), lines = String(r.result).split(/\r?\n/).filter(l => l.trim());
      const hdr = lines.shift().split(',').map(h => h.trim().toLowerCase());
      const col = n => hdr.findIndex(h => h.includes(n));
      const ci = {name:col('name'), role:col('role'), ceil:col('ceil'), idx:col('index'), bid:col('bid'), at:col('submit'), port:col('portfolio')};
      if (ci.name < 0 || ci.bid < 0) { toast('The file needs at least "name" and "bid" columns'); return; }
      let added = 0;
      lines.forEach(l => {
        const v = l.split(',').map(s => s.trim()), num = i => i < 0 || v[i] === '' || v[i] == null ? null : +v[i];
        // in a batch export, the portfolio column says which resignation the bid is for
        const target = ci.port >= 0 && g.length > 1 ? g.find(x => x.portfolio.name.toLowerCase() === (v[ci.port] || '').toLowerCase() || x.id === v[ci.port]) : c;
        if (!target) return;
        const role = (v[ci.role] || 'CSM').toUpperCase().includes('ASM') ? 'ASM' : 'CSM';
        target.bids.push({id:nid('b'), name:v[ci.name], role, ceiling:num(ci.ceil), csmIndex:role === 'CSM' ? num(ci.idx) : null, asmIndex:role === 'ASM' ? num(ci.idx) : null, bid:num(ci.bid), submittedAt:ci.at >= 0 && Date.parse(v[ci.at]) ? Date.parse(v[ci.at]) : Date.now(), eligible:null, papip:null, prev:null, trend:null});
        added++;
      });
      g.forEach(x => { x.attachments.push({name:file.name, at:Date.now(), by:who()}); log(x, `Poll export imported from ${file.name}`); });
      commit(added + ' responses imported');
    };
    r.readAsText(file); t.value = '';
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'decide-form') {
    const c = cur(), g = group(c), picks = g.map(x => ({x, r:e.target.querySelector(`input[name="pick-${x.id}"]:checked`)}));
    const missing = picks.filter(p => !p.r);
    if (missing.length) { err('decide-err', g.length > 1 ? `Select a CSM for: ${missing.map(p => esc(p.x.portfolio.name)).join(', ')}.` : 'Select a bidder first.'); return; }
    const n = Date.now(), remarks = val('remarks');
    picks.forEach(({x, r}) => {
      const b = x.bids.find(y => y.id === r.value);
      x.decision = {by:who(), bidderId:b.id, at:n, remarks}; x.incoming = b.name;
      log(x, `Selected ${b.name} as incoming CSM${g.length > 1 ? ` (batch decision for ${x.batchId})` : ''}`); setStage(x, 5);
    });
    commit(g.length > 1 ? `All ${g.length} portfolios allocated` : picks[0].x.incoming + ' recorded as incoming CSM');
  }
  if (e.target.id === 'task-form') {
    const c = cur(); c.tasks.push({id:nid('t'), title:val('task-title'), owner:val('task-owner'), due:c.lwd, status:'todo', blocker:''});
    log(c, 'Task added: ' + val('task-title')); commit('Task added');
  }
});
setInterval(() => { if (!document.getElementById('scrim') && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) render(); }, 60000);
render();
boot();
</script>
